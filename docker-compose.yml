services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./data/verification/dbt-target:/app/transformations/target
      - ./data/verification/dbt-logs:/app/transformations/logs

    environment:
      PREFECT_LOGGING_LEVEL: INFO

    command:
      - python
      - orchestration/pipeline.py

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    volumes:
      - ./data:/app/data:ro

    ports:
      - "8501:8501"

    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

