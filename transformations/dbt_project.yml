name: taxi_pipeline
version: "1.0.0"
config-version: 2

profile: taxi_pipeline

model-paths:
  - models

test-paths:
  - tests

target-path: target
clean-targets:
  - target
  - dbt_packages

# Project period (start inclusive, end exclusive). The pipeline passes these
# with --vars; the defaults reproduce the submitted January-June 2025 build.
# batch_file / batch_start / batch_end are set only for an incremental batch.
vars:
  period_start: "2025-01-01"
  period_end: "2025-07-01"

models:
  taxi_pipeline:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
